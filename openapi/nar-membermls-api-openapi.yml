openapi: 3.2.0
info:
  title: M1Gateway - External Member MLS API
  version: v1
security:
- basic: []
tags:
- name: MemberMLS
paths:
  /ext/MemberMLS/MemberId/{memberId}:
    get:
      tags:
      - MemberMLS
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
  /ext/MemberMLS:
    patch:
      tags:
      - MemberMLS
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_MLS'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_MLS'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_MLS'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MemberMLSPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/MemberMLSPatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MemberMLSPatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MemberMLSPatch'
    post:
      tags:
      - MemberMLS
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_MLS'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_MLS'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_MLS'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_MLS'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_MLS'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_MLS'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_MLS'
components:
  schemas:
    MemberMLSPatch:
      type: object
      properties:
        member_Id:
          format: int32
          type: integer
        association_Id:
          format: int32
          type: integer
        updates:
          $ref: '#/components/schemas/Member_MLSJsonPatchDocument'
    Member_MLSOperation:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    OperationType:
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
    Member_MLS:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
          format: date-time
          type: string
        last_Changed_By:
          type: string
        last_Changed_Datetime:
          format: date-time
          type: string
        source_System_Id:
          format: int32
          type: integer
        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        member_Id:
          format: int32
          type: integer
        association_Id:
          format: int32
          type: integer
        local_Join_Date:
          format: date-time
          type: string
        member_Status_Code:
          type: string
        member_Status_Date:
          format: date-time
          type: string
        timestamp_Seq:
          format: int64
          type: integer
        owning_Poe_Id:
          format: int32
          type: integer
        associationName:
          type: string
        associationTypeCode:
          type: string
        associationState:
          type: string
        memberStatusCodeDescription:
          type: string
        historyCount:
          format: int32
          type: integer
    Member_MLSJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Member_MLSOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
    IContractResolver:
      type: object
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
