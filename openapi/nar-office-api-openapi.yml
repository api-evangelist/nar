              $ref: '#/components/schemas/BizOfficeSearch'
  /ext/Office/{officeId}:
    get:
      tags:
      - Office
      parameters:
      - in: path
        name: officeId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
  /ext/Office/Full/{officeId}:
    get:
      tags:
      - Office
      parameters:
      - in: path
        name: officeId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
  /ext/Office:
    patch:
      tags:
      - Office
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Office'
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
            text/json:
              schema:
                $ref: '#/components/schemas/Office'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/OfficePatch'
          application/json:
            schema:
              $ref: '#/components/schemas/OfficePatch'
          text/json:
            schema:
              $ref: '#/components/schemas/OfficePatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OfficePatch'
    post:
      tags:
      - Office
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Office'
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
            text/json:
              schema:
                $ref: '#/components/schemas/Office'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Office'
          application/json:
            schema:
              $ref: '#/components/schemas/Office'
          text/json:
            schema:
              $ref: '#/components/schemas/Office'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Office'
  /ext/Office/Transfer/{officeId}:
    post:
      tags:
      - Office
      parameters:
      - in: path
        name: officeId
