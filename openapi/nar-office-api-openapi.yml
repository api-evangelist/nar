security:
- basic: []
tags:
- name: Office
paths:
  /ext/Office/Search:
    post:
      tags:
      - Office
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
      requestBody:
        content:
          application/json-patch+json:
