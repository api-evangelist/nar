              schema:
                $ref: '#/components/schemas/OfficeSecondary'
            text/json:
              schema:
                $ref: '#/components/schemas/OfficeSecondary'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/OfficeSecondary'
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeSecondary'
          text/json:
            schema:
              $ref: '#/components/schemas/OfficeSecondary'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OfficeSecondary'
    patch:
      tags:
      - OfficeSecondary
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OfficeSecondary'
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeSecondary'
            text/json:
              schema:
                $ref: '#/components/schemas/OfficeSecondary'
      requestBody:
