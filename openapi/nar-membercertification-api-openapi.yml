openapi: 3.2.0
info:
  title: M1Gateway - External Member Certification API
  version: v1
security:
- basic: []
tags:
- name: MemberCertification
paths:
  /ext/MemberCertification/MemberId/{memberId}:
    get:
      tags:
      - MemberCertification
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
  /ext/MemberCertification:
    patch:
      tags:
      - MemberCertification
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MemberCertificationPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCertificationPatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MemberCertificationPatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MemberCertificationPatch'
    post:
      tags:
      - MemberCertification
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
    delete:
      tags:
      - MemberCertification
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Certification'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Certification'
components:
  schemas:
    MemberCertificationPatch:
      type: object
      properties:
        member_Id:
          format: int32
          type: integer
        entering_Association_Id:
          format: int32
          type: integer
        certification_Code:
          type: string
        course_Number:
          type: string
        updates:
          $ref: '#/components/schemas/Member_CertificationJsonPatchDocument'
    Member_CertificationJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Member_CertificationOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
    OperationType:
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
    Member_CertificationOperation:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    Member_Certification:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
          format: date-time
          type: string
        last_Changed_By:
          type: string
        last_Changed_Datetime:
          format: date-time
          type: string
        source_System_Id:
          format: int32
          type: integer
        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        member_Id:
          format: int32
          type: integer
        entering_Association_Id:
          format: int32
          type: integer
        certification_Code:
          type: string
        course_Number:
          type: string
        course_Description:
          type: string
        course_Complete_Date:
          format: date-time
          type: string
        sponsoring_Entity_Id:
          format: int32
          type: integer
        timestamp_Seq:
          format: int64
          type: integer
        enteringAssociationName:
          type: string
        certificationDisplayCode:
          type: string
        certificationDescription:
          type: string
        sponsoringEntityName:
          type: string
    IContractResolver:
      type: object
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
