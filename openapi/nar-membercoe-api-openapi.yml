openapi: 3.2.0
info:
  title: M1Gateway - External Member Coe API
  version: v1
security:
- basic: []
tags:
- name: MemberCoe
paths:
  /ext/MemberCoe/MemberId/{memberId}:
    get:
      tags:
      - MemberCoe
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
  /ext/MemberCoe:
    patch:
      tags:
      - MemberCoe
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MemberCoePatch'
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCoePatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MemberCoePatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MemberCoePatch'
    post:
      tags:
      - MemberCoe
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
    delete:
      tags:
      - MemberCoe
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Coe'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Coe'
components:
  schemas:
    Member_CoeJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Member_CoeOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
    OperationType:
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
    Member_Coe:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
          format: date-time
          type: string
        last_Changed_By:
          type: string
        last_Changed_Datetime:
          format: date-time
          type: string
        source_System_Id:
          format: int32
          type: integer
        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        member_Id:
          format: int32
          type: integer
        entering_Association_Id:
          format: int32
          type: integer
        course_Code:
          type: string
        year_Taken:
          type: string
        cycle_Number:
          type: string
        course_Start_Date:
          format: date-time
          type: string
        course_Completion_Date:
          format: date-time
          type: string
        is_New_Member_Flag:
          type: string
        course_Description:
          type: string
        state_Ce_Hours:
          format: double
          type: number
        sponsoring_Entity_Id:
          format: int32
          type: integer
        timestamp_Seq:
          format: int64
          type: integer
        owning_Poe_Id:
          format: int32
          type: integer
        enteringAssociationName:
          type: string
        sponsoringAssociationName:
          type: string
        cycleDescription:
          type: string
        courseNumber:
          type: string
    MemberCoePatch:
      type: object
      properties:
        member_Id:
          format: int32
          type: integer
        entering_Association_Id:
          format: int32
          type: integer
        course_Code:
          type: string
        cycle_Number:
          type: string
        year_Taken:
          type: string
        course_Completion_Date:
          format: date-time
          type: string
        updates:
          $ref: '#/components/schemas/Member_CoeJsonPatchDocument'
    Member_CoeOperation:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    IContractResolver:
      type: object
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
