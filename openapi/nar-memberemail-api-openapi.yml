openapi: 3.2.0
info:
  title: M1Gateway - External Member Email API
  version: v1
security:
- basic: []
tags:
- name: MemberEmail
paths:
  /ext/MemberEmail/MemberId/{memberId}:
    get:
      tags:
      - MemberEmail
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member_Email'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member_Email'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member_Email'
  /ext/MemberEmail:
    patch:
      tags:
      - MemberEmail
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Email'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Email'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Email'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MemberEmailPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/MemberEmailPatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MemberEmailPatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MemberEmailPatch'
    post:
      tags:
      - MemberEmail
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Email'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Email'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Email'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Email'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Email'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Email'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Email'
components:
  schemas:
    Member_Email:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
          format: date-time
          type: string
        last_Changed_By:
          type: string
        last_Changed_Datetime:
          format: date-time
          type: string
        source_System_Id:
          format: int32
          type: integer
        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        member_Id:
          format: int32
          type: integer
        email_Address:
          type: string
        email_Type_Code:
          type: string
        is_Active_Flag:
          type: string
        verified_Flag:
          type: string
        emailTypeDescription:
          type: string
    OperationType:
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
    MemberEmailPatch:
      type: object
      properties:
        member_Id:
          format: int32
          type: integer
        email_Type_Code:
          type: string
        source_Method_Id:
          format: int32
          type: integer
        updates:
          $ref: '#/components/schemas/Member_EmailJsonPatchDocument'
    Member_EmailJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Member_EmailOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
    Member_EmailOperation:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    IContractResolver:
      type: object
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
