        priorTreasurer:
          type: string
        future_President_Member_Id:
          format: int32
          type: integer
        futurePresident:
          type: string
        future_President_Elect_Member_Id:
          format: int32
          type: integer
        futurePresidentElect:
          type: string
        future_Secretary_Member_Id:
          format: int32
          type: integer
        futureSecretary:
          type: string
        future_Treasurer_Member_Id:
          format: int32
          type: integer
        futureTreasurer:
          type: string
        election_Month:
          type: string
        commercial_Affiliate_Flag:
          type: string
        timestamp_Seq:
          format: int64
          type: integer
        single_Owned_MLS_Flag:
          type: string
        single_Owned_MLS_Name:
          type: string
        allow_Poe_Proxy:
          type: string
        charter_Date:
