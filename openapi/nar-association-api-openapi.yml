      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    Association_Board_Serviced:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
