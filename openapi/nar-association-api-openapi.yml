          type: string
        associationName:
          type: string
        associationState:
          type: string
        associationCity:
          type: string
        associationZip:
          type: string
        includeDissolvedFlag:
          type: string
    AssociationPatch:
      type: object
      properties:
        associationId:
          format: int32
          type: integer
        updates:
          $ref: '#/components/schemas/AssociationJsonPatchDocument'
    IContractResolver:
      type: object
    AssociationJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/AssociationOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
