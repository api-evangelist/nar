        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        association_Id:
          format: int32
          type: integer
        board_Serviced_Association_Id:
          format: int32
          type: integer
        assocIdName:
          type: string
        assocNameState:
          type: string
