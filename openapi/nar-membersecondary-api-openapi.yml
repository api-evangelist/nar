openapi: 3.2.0
info:
  title: M1Gateway - External Member Secondary API
  version: v1
security:
- basic: []
tags:
- name: MemberSecondary
paths:
  /ext/MemberSecondary/MemberId/{memberId}:
    get:
      tags:
      - MemberSecondary
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
  /ext/MemberSecondary:
    post:
      tags:
      - MemberSecondary
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Member_Secondary'
          application/json:
            schema:
              $ref: '#/components/schemas/Member_Secondary'
          text/json:
            schema:
              $ref: '#/components/schemas/Member_Secondary'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Member_Secondary'
    patch:
      tags:
      - MemberSecondary
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
            application/json:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
            text/json:
              schema:
                $ref: '#/components/schemas/Member_Secondary'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/MemberSecondaryPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSecondaryPatch'
          text/json:
            schema:
              $ref: '#/components/schemas/MemberSecondaryPatch'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MemberSecondaryPatch'
components:
  schemas:
    Member_Secondary:
      type: object
      properties:
        first_Inserted_By:
          type: string
        first_Inserted_Datetime:
          format: date-time
          type: string
        last_Changed_By:
          type: string
        last_Changed_Datetime:
          format: date-time
          type: string
        source_System_Id:
          format: int32
          type: integer
        source_Method_Id:
          format: int32
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        coreEntityStatusCode:
          type: string
        canEdit:
          type: string
        sourceSystemDisplayName:
          type: string
        isInternal:
          type: boolean
        returnField:
          type: boolean
        isPubSub:
          type: boolean
        id:
          format: int32
          type: integer
        member_Id:
          format: int32
          type: integer
        association_Id:
          format: int32
          type: integer
        local_Join_Date:
          format: date-time
          type: string
        re_License_Number:
          type: string
        license_State:
          type: string
        arbitration_Ethics_Pending:
          type: string
        office_Id:
          format: int32
          type: integer
        member_Type_Code:
          type: string
        member_Status_Code:
          type: string
        member_Status_Date:
          format: date-time
          type: string
        dues_Waived_Flag:
          type: string
        special_Discount_Flag:
          type: string
        member_SubClass:
          type: string
        timestamp_Seq:
          format: int64
          type: integer
        associationName:
          type: string
        associationState:
          type: string
        associationTypeCode:
          type: string
        associationTypeDescription:
          type: string
        originalOfficeId:
          format: int32
          type: integer
        officeBusinessName:
          type: string
        memberTypeDescription:
          type: string
        memberStatusDescription:
          type: string
        stateDescription:
          type: string
        historyCount:
          format: int32
          type: integer
    OperationType:
      format: int32
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
    Member_SecondaryJsonPatchDocument:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Member_SecondaryOperation'
          readOnly: true
        contractResolver:
          $ref: '#/components/schemas/IContractResolver'
    MemberSecondaryPatch:
      type: object
      properties:
        member_Id:
          format: int32
          type: integer
        association_Id:
          format: int32
          type: integer
        office_Id:
          format: int32
          type: integer
        member_Type_Code:
          type: string
        updates:
          $ref: '#/components/schemas/Member_SecondaryJsonPatchDocument'
    Member_SecondaryOperation:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/OperationType'
        path:
          type: string
        op:
          type: string
        from:
          type: string
        value: {}
    IContractResolver:
      type: object
  securitySchemes:
    basic:
      type: http
      scheme: basic
      description: Basic Authorization header using user and password
