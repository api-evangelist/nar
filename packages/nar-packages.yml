api: REALTORS M1 Gateway External API
summary: >-
  NAR ships no client library for the M1 Gateway External API. Searched npm, PyPI, Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist and crates.io on 2026-07-26 plus the NAR GitHub organization: the only
  first-party packages NAR has ever published are RETS-era artifacts from the Center for REALTOR
  Technology (CRT), last released in 2015, which target the deprecated RETS protocol and the RESO Web API
  - not M1, and not any API NAR operates today. They are recorded here as provenance, not as a current
  SDK. The supported integration path for the M1 Gateway is the raw HTTP surface plus NAR's published
  Postman collection.
