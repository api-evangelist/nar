api: REALTORS M1 Gateway External API
summary: >-
  NAR operates separate test and production environments for the M1 Gateway and issues distinct
  credentials for each, but neither the test host nor any test credential is published. There is no
  self-serve sandbox, no console, no hosted playground and no public test data set - the sandbox exists
  only inside a partner relationship. What NAR does publish openly is the Postman collection that drives
  it, pre-populated with deliberately fake sample values.
self_serve: false
environments:
  - name: production
    base_url: https://m1gateway.realtor
    resolved_host: https://nar.m1gateway.realtor
    credentials: Issued by NAR, production-only.
    verified: 'Live 2026-07-26 - returns HTTP 401 without credentials.'
  - name: test
    base_url: null
    credentials: Issued by NAR, test-only.
    published: false
    note: >-
      NAR states in the collection that "Credentials are environment-specific - test credentials must not
      be used against production, and vice versa. NAR will supply your credentials." The test host itself
      is not named in any public artifact.
credential_issuance:
  self_service: false
  process: Direct issuance by NAR to external AMS vendors and NAR partners.
  audience: External association management system vendors and NAR partners.
