summary: 'Entity-relationship graph derived from the 99 definitions in NAR''s published M1 Gateway Swagger
  2.0 document. The graph is member-centric: Member is the hub, keyed by MemberId (the NRDS successor
  identifier), with roughly twenty sub-record types hanging off it (address, phone, email, certification,
  code of ethics, demographic, designation, dues payment, education, fair housing, field of business,
  ISC affiliation, language, MLS, military service, secondary affiliation). Office and Association are
  the two other roots; Data_Extract_Request and Data_Extract_Schedule model the bulk/pull delivery surface.
  JSON Patch envelope types (*Patch/*Operation/*JsonPatchDocument) are excluded as transport shapes, not
  entities.'
