aid: nar
name: National Association of REALTORS
slug: nar
homeMarket: United States
tier: industry-body
reviewer: API Evangelist
reviewed: '2026-07-26'

review:
  question: >-
    Does the National Association of REALTORS publish a reachable, documented public API surface, and
    what is its RESO posture as the industry body that mandates the standard?
  answer: >-
    Partially. NAR publishes no self-serve developer portal and no open data API. It does publish, openly
    and without authentication, a Swagger 2.0 definition and a Postman collection for the REALTORS M1
    Gateway External API on its public GitHub organization, and the API host is live but answers 401
    without NAR-issued HTTP Basic credentials. NAR itself holds no RESO certification; it is the body that
    REQUIRES association-owned MLSs to hold one.
  date: '2026-07-26'

sectorPosture:
  resoPosture: >-
    Mandator, not certificand. NAR MLS Policy Statement 7.90 (Handbook on Multiple Listing Policy,
    Operational Issues Section 12, amended 11/20) states verbatim: "MLS organizations owned and operated by
    associations of REALTORS(R) will implement the RESO Standards including: the RESO Data Dictionary by
    January 1, 2016; the RESO Web API by June 30, 2016 and will keep current by implementing new releases
    of RESO Standards within one (1) year from ratification. Compliance with this requirement can be
    demonstrated using the Real Estate Standards Organization (RESO) compliance Certification Process. Web
    API data access provided to participants and subscribers must have no less than the same data available
    via data access methods such as RETS or FTP systems, and MLS fields that exist in the RESO Data
    Dictionary must be delivered in conformance with the standard." NAR created RETS in 2002 and spun the
    standards work out to RESO, incorporated as an independent nonprofit in 2011. NAR is therefore the
    industry body that imposes a machine-readable contract on the US residential market without operating
    one itself.
  resoCertified: false
  resoCertifiedEvidence: >-
    The public RESO certificate directory at https://www.reso.org/certificates/ (HTTP 200, fetched
    2026-07-26, 416,233 bytes) contains no certificate entry for the National Association of REALTORS or
    for REALTORS Property Resource. The only occurrences of the string "RPR" in that page are navigation
    links to the RPR Connections Grant, not certificate records. NAR does not operate an MLS, so there is
    nothing for it to certify.
  resoArtifactsProbed:
  - url: https://www.reso.org/
    status: 200
    note: RESO organisation site, publicly reachable.
  - url: https://www.reso.org/certification/
    status: 200
    note: >-
      Public certification page. Certifies Web API Core 2.0.0, Data Dictionary 2.0, and RESO Common Format
      (RCF). Points at the certificate directory and at RESO Analytics.
  - url: https://www.reso.org/certificates/
    status: 200
    note: Public directory of certified organizations, freely browsable, no login.
  - url: https://transport.reso.org/
    status: 200
    note: Public home of the RESO Web API / transport specifications.
  - url: https://certification.reso.org/
    status: 400
    note: >-
      RESO Analytics live certification reports. Bare host returns 400; individual summaries are linked
      per-certificate from https://www.reso.org/certificates/ (e.g. /summary/M00000001).
  - url: https://ddwiki.reso.org/
    status: 200
    note: Redirects to https://dd.reso.org/ - the public Data Dictionary wiki.
  - url: https://api.reso.org/
    status: 000
    note: Does not resolve. No RESO-operated API host.
  - url: https://api.reso.org/$metadata
    status: 000
    note: >-
      No OData $metadata document is served by RESO or by NAR. RESO $metadata documents belong to
      individual certified MLSs and resellers, each behind a licence.
  - url: https://www.nar.realtor/reso
    status: 404
    note: NAR has no dedicated RESO landing page under that path.
  standardsFreelyDownloadable: true
  standardsAccessNote: >-
    The RESO Data Dictionary wiki (dd.reso.org) and the transport/Web API specifications (transport.reso.org)
    are publicly reachable without membership, and the certificate directory is public. NAR's own page on
    RETS explicitly frames this as open standards providing "free access to the specifications". The
    SPECIFICATION is free; the DATA behind a certified endpoint is not.
  universalPropertyIdentifier:
    found: false
    note: >-
      https://www.reso.org/universal-property-identifier/ redirects (200) to
      https://www.reso.org/universal-parcel-identifier/. No UPI reference and no UPI artifact is published
      on any NAR-controlled host. NAR's GitHub org does hold an archived 2017 experiment,
      NationalAssociationOfRealtors/PropertyUniqueIdentifier ("An Ethereum based distributed ledger to
      register, track, and query property unique identifiers"), last pushed 2017-08-06 - historical only,
      not a live artifact.

accessGate:
  classification: partner-only
  whatADeveloperMustSignOrJoin: >-
    There is no public sign-up for anything NAR operates. (1) For the M1 Gateway External API, the
    published Postman collection states plainly: "Credentials are environment-specific - test credentials
    must not be used against production, and vice versa. NAR will supply your credentials." The audience is
    named in the repo description as "external AMSs and NAR partners" - i.e. association management system
    vendors serving REALTOR associations, under a commercial/partner relationship with NAR. No application
    form, pricing page, or self-serve console exists on any NAR host. (2) For the MLS listing data that NAR
    mandates be exposed over RESO Web API, NAR is not the grantor at all: a developer must obtain access
    from an individual MLS through MLS membership, an IDX or VOW agreement, a broker or agent sponsorship,
    or a commercial reseller (Bridge, Trestle, MLS Grid, Spark). (3) REALTORS Property Resource
    (www.narrpr.com), NAR's wholly-owned property data subsidiary, is a benefit gated behind NAR
    membership; api.narrpr.com and developer.narrpr.com both resolve but serve an identical wildcard "RPR -
    Maintenance Underway!" holding page that JavaScript-redirects to www.narrpr.com - they are not
    developer surfaces.
  gated: true
  selfServePortal: false

openData:
  exists: false
  note: >-
    NAR publishes extensive housing research (https://www.nar.realtor/research-and-statistics, HTTP 200)
    including Existing-Home Sales and county median home price series, but it is distributed as reports and
    spreadsheets under NAR citation guidelines, not as an open API, and https://www.nar.realtor/robots.txt
    disallows crawling of .pdf/.doc/.xls assets. https://www.nar.realtor/data returns 404. There is no US
    open-data counterweight here comparable to HM Land Registry Price Paid or Ordnance Survey open products;
    in the United States the listing corpus is private cooperative property.

authModel:
  scheme: HTTP Basic
  evidence: >-
    The harvested Swagger 2.0 document declares a single securityDefinition, {"basic": {"type": "basic",
    "description": "Basic Authorization header using user and password"}}, and applies it globally via
    security: [{"basic": []}]. The Postman collection carries a collection variable authBasicExternal with
    the placeholder "Basic YOUR_BASE64_CREDENTIALS_HERE".
  oauth: false
  openidConnect:
    probed:
    - url: https://www.nar.realtor/.well-known/openid-configuration
      status: 404
    - url: https://nar.m1gateway.realtor/.well-known/openid-configuration
      status: 401
      note: Returns 401 rather than a discovery document - the gateway rejects unauthenticated requests wholesale.
    - url: https://nar.m1.realtor/.well-known/openid-configuration
      status: 200
      note: Returns text/html (the M1 SPA shell), not a JSON discovery document. Not an OIDC endpoint.
    found: false
  rateLimits: >-
    Live and advertised in response headers on an unauthenticated 401 from
    https://nar.m1gateway.realtor/ext/Member: X-Rate-Limit-Limit: 600s, X-Rate-Limit-Remaining: 5999,
    X-Rate-Limit-Reset: 2026-07-26T22:45:11Z.

