  - url: https://api.nar.realtor/
    status: 000
    note: Does not resolve.
  - url: https://docs.nar.realtor/
    status: 000
    note: Does not resolve.
  contractPaths:
  - url: https://www.nar.realtor/developers
    status: 404
  - url: https://www.nar.realtor/api
    status: 404
  - url: https://www.nar.realtor/openapi.json
    status: 404
  - url: https://www.nar.realtor/swagger.json
    status: 404
  - url: https://www.nar.realtor/.well-known/security.txt
    status: 404
  m1Gateway:
  - url: https://m1gateway.realtor/
    status: 401
    note: Redirects to https://nar.m1gateway.realtor/ and returns 401 Unauthorized. Host is live.
  - url: https://nar.m1gateway.realtor/ext/Member
    status: 401
    note: >-
      Live API endpoint. 401 with Content-Length 0, Azure ARRAffinity cookies, and X-Rate-Limit-* headers.
      Confirms the base URL published in the Postman collection is real and in production.
  - url: https://nar.m1gateway.realtor/swagger/v1/swagger.json
    status: 000
    note: Connection refused/reset. Swagger UI is not exposed publicly on the gateway host.
  - url: https://nar.m1gateway.realtor/swagger/index.html
    status: 000
    note: Connection refused/reset.
  - url: https://m1.realtor/
    status: 200
    note: Redirects to https://nar.m1.realtor/ - the M1 web application (login), not a developer surface.
  rpr:
  - url: https://www.narrpr.com/
    status: 200
    note: REALTORS Property Resource - NAR member benefit, Angular SPA behind login.
  - url: https://api.narrpr.com/
    status: 200
    note: Wildcard "RPR - Maintenance Underway!" holding page that JS-redirects to www.narrpr.com. Not an API.
  - url: https://developer.narrpr.com/
    status: 200
    note: Identical wildcard holding page. Not a developer portal.
  github:
  - url: https://api.github.com/orgs/NationalAssociationOfRealtors
    status: 200
    note: >-
      Real NAR GitHub organization, created 2014-04-04, 61 public repos, org updated 2026-07-03, blog
      https://www.nar.realtor/. Avatar used as the provider image.
  - url: https://github.com/NationalAssociationOfRealtors/M1-Developer-Guide-Supplemental-Docs
    status: 200
