      Created and pushed 2026-07-08. Description "Included are the Postman and Swagger files to help with
      testing and implementation for external AMSs and NAR partners". Three files, no licence. This is the
      closest thing NAR has to a developer portal - a public GitHub repo, not a self-serve console.
  historicalOpenSource:
  - repo: libRETS
    note: RETS client library in C++, last pushed 2023-12-13. NAR's original RETS-era tooling.
  - repo: ezRETS
    note: ODBC driver connecting to RETS servers, last pushed 2019-08-23.
  - repo: reso-api-server
    note: An OData server supporting RESO's RETS Web API, last pushed 2018-11-08. Reference implementation, not a NAR service.
  - repo: reso-api-oauth2-server
    note: An OAuth2 server supporting RESO's RETS Web API, last pushed 2014-09-25.
  - repo: reso-data-dictionary
    note: RESO Data Dictionary shaped to drive JayData OData clients/servers, last pushed 2015-06-05.
  - repo: variman
    note: Java RETS server exported from Google Code, last pushed 2020-10-04.

