absences:
  webhooks: >-
    None. No webhook, callback, event or subscription path appears in the M1 Gateway Swagger document, and
    no NAR host publishes an AsyncAPI or event catalogue. Change delivery in M1 is pull-based via the
    DataExtractRequest and DataExtractSchedule resources.
  sdks: >-
    None current. NAR ships no client SDK for the M1 Gateway API. The only NAR-authored client libraries on
    GitHub are the RETS-era libRETS (C++) and ezRETS (ODBC), which target the deprecated RETS protocol, not
    M1 and not RESO Web API.
  graphql: None found.
  mcp: None found.
  statusPage: None found on any NAR-controlled host.
  changelog: None published for the M1 Gateway API.
  securityTxt: Absent - /.well-known/security.txt and /security.txt both 404.
  vulnerabilityDisclosure: None published.
  pricing: >-
    None published for any NAR API. There is no plan, tier, or quota page; access is arranged directly with
    NAR.

findings:
  summary: >-
    NAR is the cleanest illustration in this sector study of certification not equalling reachability. It
    is the only body in the whole study that imposes a mandated machine-readable contract on a market -
    Policy Statement 7.90 forces every association-owned MLS onto the RESO Data Dictionary and the RESO Web
    API and requires them to stay within one year of each ratification - and yet nothing NAR mandates is
    callable by an ordinary developer, because the certified endpoint belongs to one of roughly 500 private
    local cooperatives and the data behind it is licensed through MLS membership, an IDX or VOW agreement, a
    broker relationship, or a reseller. NAR itself is not RESO-certified and never could be; it runs no MLS.
    Separately, NAR does operate one genuine production API of its own - the REALTORS M1 Gateway, over
    member, office and association records rather than listings - and in July 2026 it began publishing that
    API's Swagger 2.0 definition and a Postman collection openly on GitHub. That artifact is public; the
    credentials are not. The honest read is a real, well-documented, partner-gated membership API sitting
    beside a mandated-but-unreachable listing standard, with no open data anywhere in the picture.
  statusCall: built
  statusRationale: >-
    A real, parseable, publicly downloadable machine-readable contract (64-path Swagger 2.0) plus a Postman
    collection were harvested from a NAR-controlled public source, and the API host was confirmed live.
    That is more than an identity-only stub, even though onboarding is partner-gated and no self-serve
    portal exists.
