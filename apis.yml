aid: nar
url: https://raw.githubusercontent.com/api-evangelist/nar/refs/heads/main/apis.yml
name: National Association of REALTORS
kind: company
description: >-
  The National Association of REALTORS (NAR) is the largest trade association in the United States,
  representing roughly one million members across residential and commercial real estate. NAR is the
  industry body that sits above the roughly 500 local Multiple Listing Services, and it is the reason
  the US residential market has a machine-readable contract at all: MLS Policy Statement 7.90 requires
  MLS organizations owned and operated by associations of REALTORS to implement the RESO Data Dictionary
  and the RESO Web API and to stay current within one year of each ratification, with compliance
  demonstrated through the RESO Certification Process. NAR mandates that standard rather than operating
  it - RESO is a separate organization, and the listing data behind every certified endpoint is licensed
  through MLS membership, an IDX or VOW agreement, a broker relationship, or a reseller. NAR itself holds
  no RESO certification and publishes no self-serve developer portal. Its own API surface is REALTORS M1,
  the members-first engagement system that replaces NRDS: the M1 Gateway External API is a live,
  HTTP-Basic-authenticated REST API over member, office, association and data-extract records, whose
  Swagger 2.0 definition and Postman collection NAR publishes openly on GitHub for external association
  management system vendors and NAR partners, but whose credentials NAR issues only under a partner
  relationship.
