apis:
- aid: nar:nar-m1-gateway-external-api
  name: REALTORS M1 Gateway External API
  description: >-
    The external surface of NAR's REALTORS M1 Gateway - the members-first engagement system that is the
    single source of truth for REALTOR member data across state and local associations. The published
    Swagger 2.0 definition documents 64 paths under /ext/ covering Association, Member, Member Address,
    Certification, Code of Ethics, Demographic, Designation, Dues Payment, Education, Email, Fair Housing,
    Field of Business, ISC Affiliation, Language, MLS, Military Service, Phone, Secondary and Single-Owned
    MLS records, plus Office, Office Secondary, Data Extract Request and Data Extract Schedule. All calls
    require HTTP Basic authentication with environment-specific credentials issued by NAR; PATCH operations
    use a test/replace JSON Patch pattern where the test value must match the current stored value. The
    definition and a Postman collection are published openly by NAR on GitHub for external AMS vendors and
    NAR partners; the API host itself answers 401 without credentials and enforces a documented rate limit.
  humanURL: https://github.com/NationalAssociationOfRealtors/M1-Developer-Guide-Supplemental-Docs
  baseURL: https://m1gateway.realtor
